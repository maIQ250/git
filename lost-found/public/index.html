<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>校园失物招领系统</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="index.html">
        <span class="brand-mark" aria-hidden="true">失</span>
        <span>校园失物招领系统</span>
      </a>
    </header>

    <main class="page">
      <div class="page-head">
        <span class="eyebrow">校园服务</span>
        <h1>请选择入口</h1>
        <p>学生可以发布失物与招领信息、搜索并申请认领；管理员负责审核信息与维护账号。</p>
      </div>

      <div class="entry-grid">
        <a class="entry-card" href="student-login.html">
          <span class="entry-icon" aria-hidden="true">🎒</span>
          <h2>学生入口</h2>
          <ul>
            <li>用学号登录或注册新账号</li>
            <li>发布寻物 / 招领信息</li>
            <li>搜索信息并提交认领申请</li>
          </ul>
          <span class="go">进入学生端 →</span>
        </a>

        <a class="entry-card admin" href="admin-login.html">
          <span class="entry-icon" aria-hidden="true">🛡️</span>
          <h2>管理员入口</h2>
          <ul>
            <li>审核学生发布的信息</li>
            <li>查看全部信息与统计数据</li>
            <li>管理学生账号</li>
          </ul>
          <span class="go">进入管理端 →</span>
        </a>
      </div>

      <div class="card" style="margin-top: 22px">
        <h2>演示账号</h2>
        <p class="muted">
          学生：学号 <strong>111</strong> / 密码 <strong>222</strong>　·　管理员：账号
          <strong>123</strong> / 密码 <strong>456</strong>
        </p>
      </div>
    </main>
  </body>
</html>
