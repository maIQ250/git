# 把仓库里的两个前端项目发布到 GitHub Pages
#
# 站点结构：
#   /            校园机会板（本次考核作品，评委直接点开就是这个）
#   /todo-list/  待办清单
#
# 为什么用 Actions：GitHub Pages 的静态托管只支持根目录或 /docs，
# 而仓库里放了多个项目。用 Actions 可以在发布前把目录拼装成想要的站点结构。
name: 部署前端项目到 GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "campus-board/**"
      - "todo-list/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 取出代码
        uses: actions/checkout@v4

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 拼装站点目录
        run: |
          mkdir -p _site/todo-list
          cp -r campus-board/. _site/
          rm -rf _site/tests _site/README.md
          cp -r todo-list/. _site/todo-list/

      - name: 打包站点
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: 发布到 Pages
        id: deployment
        uses: actions/deploy-pages@v4
