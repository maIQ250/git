<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>管理端 · 珠科雷达</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231b4fa8'/%3E%3Cpath d='M16 6l8 3v7c0 5.6-3.4 9.6-8 11-4.6-1.4-8-5.4-8-11V9l8-3Z' stroke='%23fff' stroke-width='2' fill='none' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <header class="admin-top">
    <div class="admin-brand">
      <span class="admin-mark" aria-hidden="true">
        <svg viewBox="0 0 48 48" width="26" height="26"><path d="M24 7l13 5v11c0 9-5.6 15.6-13 18-7.4-2.4-13-9-13-18V12l13-5Z" stroke="currentColor" stroke-width="3" fill="none" stroke-linejoin="round"/><path d="m18 24 4.5 4.5L31 20" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <div>
        <h1>珠科雷达 · 管理端</h1>
        <p>审核学生发布的信息，通过后才进入公开信息流</p>
      </div>
    </div>
    <a class="admin-back" href="index.html">← 返回入口页</a>
  </header>

  <main class="admin-main">
    <section class="admin-stats" id="adminStats" aria-label="审核统计"></section>

    <nav class="admin-tabs" id="adminTabs" aria-label="按状态筛选"></nav>

    <p class="admin-hint">
      「待审核」表示学生刚提交、还没进入公开信息流；它与学生端的「待核实」是两件事——
      待核实指已经公开、但内容需要读者注意的信息。
    </p>

    <ul class="admin-list" id="adminList"></ul>
    <p class="admin-empty" id="adminEmpty" hidden></p>
  </main>

  <div id="adminToast" class="admin-toast" role="status" aria-live="polite" hidden></div>

  <script src="admin.js"></script>
</body>
</html>
