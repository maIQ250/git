<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>校园机会板 · 校园活动与机会信息板</title>
  <meta name="description" content="把校园里零散的活动、竞赛、招募和学生自发信息整理成一张能判断、能行动的信息板。" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231f6f5c'/%3E%3Cpath d='M9 21.5 16 8l7 13.5' stroke='%23fff' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip-link" href="#list">跳到信息列表</a>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="28" height="28"><rect width="32" height="32" rx="9" fill="currentColor"/><path d="M9 21.5 16 8l7 13.5" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <div class="brand-text">
        <h1>校园机会板</h1>
        <p>比赛 · 讲座 · 招募 · 学生自发，一处看清</p>
      </div>
    </div>

    <div class="topbar-side">
      <div class="baseline" title="所有“还剩多久 / 是否结束”都按这个时刻计算">
        <span class="baseline-label">时间基准</span>
        <strong>9月19日 14:00</strong>
      </div>
      <button id="publishBtn" class="btn btn-primary" type="button">
        <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M10 4.5v11M4.5 10h11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        发布信息
      </button>
    </div>
  </header>

  <div class="shell">
    <section class="controls" aria-label="筛选与搜索">
      <div class="search-row">
        <label class="search">
          <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><circle cx="8.6" cy="8.6" r="5.1" stroke="currentColor" stroke-width="1.7" fill="none"/><path d="m12.6 12.6 3.6 3.6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          <span class="sr-only">搜索信息</span>
          <input id="search" type="search" placeholder="搜活动名、地点、关键词，例如“零基础”“A402”“今晚”" autocomplete="off" />
        </label>
        <div class="view-switch" role="tablist" aria-label="视图切换">
          <button id="viewAll" class="seg is-active" role="tab" aria-selected="true" type="button">全部信息</button>
          <button id="viewSaved" class="seg" role="tab" aria-selected="false" type="button">我的收藏 <span id="savedCount" class="seg-count">0</span></button>
          <button id="viewMine" class="seg" role="tab" aria-selected="false" type="button">我发布的 <span id="mineCount" class="seg-count">0</span></button>
        </div>
      </div>

      <div class="filters">
        <div class="filter-row" role="group" aria-label="来源筛选">
          <span class="filter-label">来源</span>
          <div id="filterSource" class="chips"></div>
        </div>
        <div class="filter-row" role="group" aria-label="类型筛选">
          <span class="filter-label">类型</span>
          <div id="filterType" class="chips"></div>
        </div>
        <div class="filter-row" role="group" aria-label="状态筛选">
          <span class="filter-label">状态</span>
          <div id="filterStatus" class="chips"></div>
        </div>
      </div>
    </section>

    <main class="layout">
      <section class="list-col">
        <div class="list-head">
          <p id="resultCount" class="result-count" aria-live="polite"></p>
          <label class="sort">
            <span class="sr-only">排序方式</span>
            <select id="sort">
              <option value="action">按“还能不能赶上”排序</option>
              <option value="deadline">按截止时间排序</option>
              <option value="source">按来源排序</option>
              <option value="id">按材料编号排序</option>
            </select>
          </label>
        </div>
        <ul id="list" class="list"></ul>
        <p id="empty" class="empty" hidden></p>
      </section>

      <aside id="detail" class="detail-col" aria-label="信息详情">
        <div class="detail-placeholder" id="detailPlaceholder">
          <p class="detail-placeholder-title">选一条信息看详情</p>
          <p class="detail-placeholder-text">右边会显示参与条件、地点、报名截止，以及同一活动后来发布过的补充通知。</p>
        </div>
        <div id="detailBody" class="detail-body" hidden></div>
      </aside>
    </main>
  </div>

  <footer class="footer">
    <p>数据来自考核题目第四部分的 26 条模拟信息，均不代表学校真实通知。</p>
    <p>页面把「材料没写的信息」明确标成未提供，不做推测补全。</p>
  </footer>

  <div id="modal" class="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head">
        <div>
          <h2 id="modalTitle">发布校园信息</h2>
          <p class="modal-sub">学生也可以自己发布活动、约球或组队招募。</p>
        </div>
        <button class="icon-btn" type="button" data-close aria-label="关闭">
          <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </div>

      <form id="publishForm" class="form" novalidate>
        <div class="field">
          <label for="pTitle">标题 <span class="req">必填</span></label>
          <input id="pTitle" name="title" type="text" placeholder="例如：周五晚图书馆刷题搭子" maxlength="40" />
        </div>

        <div class="field-row">
          <div class="field">
            <label for="pType">类型 <span class="req">必填</span></label>
            <select id="pType" name="type">
              <option value="">请选择</option>
              <option>约球</option>
              <option>组队招募</option>
              <option>兴趣交流</option>
              <option>二手/互助</option>
              <option>其他</option>
            </select>
          </div>
          <div class="field">
            <label for="pTime">活动时间</label>
            <input id="pTime" name="time" type="datetime-local" />
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="pLocation">地点</label>
            <input id="pLocation" name="location" type="text" placeholder="没定就写“待定”" maxlength="30" />
          </div>
          <div class="field">
            <label for="pDeadline">报名截止</label>
            <input id="pDeadline" name="deadline" type="datetime-local" />
          </div>
        </div>

        <div class="field">
          <label for="pContact">怎么找到你 <span class="req">必填</span></label>
          <input id="pContact" name="contact" type="text" placeholder="例如：群号、QQ 或“评论区留言”，不要填私人支付信息" maxlength="60" />
        </div>

        <div class="field">
          <label for="pSummary">说明</label>
          <textarea id="pSummary" name="summary" rows="3" maxlength="200" placeholder="补充人数、费用、要求等信息"></textarea>
        </div>

        <div id="formCheck" class="form-check" aria-live="polite"></div>

        <div class="form-actions">
          <button type="button" class="btn btn-ghost" data-close>取消</button>
          <button type="submit" class="btn btn-primary">发布到信息板</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
