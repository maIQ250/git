<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>待办清单</title>
  <!-- 内联 SVG 图标：避免浏览器去请求不存在的 /favicon.ico 而报 404 -->
  <link
    rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%233b5bdb'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11' fill='none' stroke='%23fff' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
  >
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="app__header">
      <h1 class="app__title">待办清单</h1>
      <p class="app__subtitle">添加任务，勾选完成，随时删除。</p>
    </header>

    <!-- 提交事件由 app.js 处理 -->
    <form class="composer" id="todo-form">
      <label class="sr-only" for="todo-input">新任务内容</label>
      <input
        class="composer__input"
        id="todo-input"
        name="text"
        type="text"
        placeholder="今天要做什么？"
        autocomplete="off"
        maxlength="200"
      >
      <button class="composer__submit" type="submit">添加</button>
    </form>

    <section class="list-section" aria-labelledby="list-heading">
      <div class="list-section__head">
        <h2 class="list-section__heading" id="list-heading">任务列表</h2>
        <p class="list-section__count" id="todo-count" aria-live="polite">0 项待完成</p>
      </div>

      <!-- 渲染出的任务条目会插入到这里 -->
      <ul class="todo-list" id="todo-list"></ul>

      <!-- 列表为空时显示，由 app.js 控制显隐 -->
      <p class="empty-state" id="empty-state">
        还没有任务，在上方输入框写下第一件事吧。
      </p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
